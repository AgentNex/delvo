name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Multi-Platform Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Tests
        run: |
          go test -v -count=1 ./...

      - name: Build All Release Artifacts
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          bash scripts/build-releases.sh "${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/delvo-*.tar.gz
            dist/delvo-*.zip
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
